<script>

 ${rows.map(r=>`<tr><td style="min-width:250px">${T(r[0])}</td>${r.slice(1).map((v,i)=>`<td class="n">${a_(C[i],fmt(r[0],v))}</td>`).join('')}</tr>`).join('')}</table>
 <p class="src">${'Source'}: ${lk('SEC EDGAR XBRL companyfacts, CIK 1326801','https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json')}; ${'each column header and figure links to the 10-Q/10-K that reported it'}. ${FS_TAB==='bs'?'Balance sheet items are point-in-time at quarter-end.':'Q4 flow items = full year − 9-month YTD. Q4 EPS and diluted shares cannot be derived by subtraction and show n/a (see the 10-K).'} ${'Q3 2026 is added once the 10-Q is filed.'}</p></div>`}

function FIN(){const F=D.fin,b=v=>v==null?na():(v<0?'−':'')+'$'+(Math.abs(v)/1e9).toFixed(2)+'bn',p=v=>v==null?na():(v>0?'+':'')+v+'%';
return `<h1>${T('Financials')}</h1><p class="sub">Segments from 10-Q/10-K XBRL (Q4 = FY − 9M); cash-flow items from XBRL companyfacts; DAP, ad metrics and headcount from Meta earnings releases. FCF = operating cash flow − purchases of P&E − finance-lease principal (Meta's definition). ARPP is published only in Meta's earnings slides and is not included yet (n/a).</p>
${FSTAB()}
<div class="two"><div class="card"><h2>${T('Segments: revenue')}</h2><div class="cw"><canvas id="f1"></canvas></div>${SRC('seg')}</div><div class="card"><h2>${T('Segments: operating income')}</h2><div class="cw"><canvas id="f2"></canvas></div>${SRC('seg')}</div></div>

<div class="card" style="overflow-x:auto"><table><tr><th>Quarter</th><th class="n">FoA rev</th><th class="n">FoA op inc</th><th class="n">RL rev</th><th class="n">RL op loss</th><th class="n">DAP (bn)</th><th class="n">Ad impr. y/y</th><th class="n">Price/ad y/y</th><th class="n">Total costs & exp.</th><th class="n">Headcount</th><th class="n">Capex+FL</th><th class="n">FCF</th><th class="n">Buybacks</th><th class="n">Dividends</th></tr>
${F.slice().reverse().map(r=>`<tr><td>${lk(ql(r.q),r.pr)}</td><td class="n">${b(r.FoA_rev)}</td><td class="n">${b(r.FoA_op)}</td><td class="n">${b(r.RL_rev)}</td><td class="n neg">${b(r.RL_op)}</td><td class="n">${r.dap??na()}</td><td class="n">${p(r.imp)}</td><td class="n">${p(r.ppa)}</td><td class="n">${b(r.opex)}</td><td class="n">${r.hc?fmtN(r.hc):na()}</td><td class="n">${b(r.capex+(r.fl||0))}</td><td class="n">${b(r.fcf)}</td><td class="n">${b(r.buyback)}</td><td class="n">${b(r.div)}</td></tr>`).join('')}</table>
<p class="src">${lk('SEC EDGAR XBRL, CIK 1326801','https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json')} · quarter links open the Meta earnings release · Expense guide FY2026: $175–179bn (Q3 2026, raised from $165–169bn). Q3 2026 column from the 8-K press release (Ex. 99.1); 10-Q filed 22 Oct 2026 (figures not yet re-pulled from XBRL). Capex guidance vs actual: see CapEx & compute tab.</p></div>

g('f1')&&charts.push(new Chart(g('f1'),{type:'bar',data:{labels:L,datasets:[{label:'Family of Apps',data:F.map(r=>r.FoA_rev/1e9),backgroundColor:'#0081FB'},{label:'Reality Labs',data:F.map(r=>r.RL_rev/1e9),backgroundColor:'#7B2FD6'}]},options:{...o,scales:{x:{stacked:true},y:{stacked:true,title:{display:true,text:'US$bn'}}}}}));

ors to reject Entergy plan for Meta data center", "s": "Transcript: report from the Baton Rouge rally against Entergy's seven gas plants for Hyperion. A North Louisiana landowner objects to a proposed transmission line, and Commissioner Davante Lewis warns that stranded costs could fall on residential ratepayers 'if Meta decided to not renew after 15 and 20 years'. The report cites Meta's claim of $2.65bn in customer savings over 20 years; Entergy calls cost-increase claims false. The clip says the vote is on 10 Dec in Shreveport, but other reports give 16 Dec.", "k": "tx"}, {"d": "2026-11-18", "ch": "Bloomberg Media Studios", "id": "X6j23VNj3us", "t": "Closing In: Taking Down Scam Networks | Presented by Meta", "s": "Transcript (Meta-sponsored): Meta describes joint scam disruption with industry partners and law enforcement, saying it disrupted 1.4 million accounts on its platforms, while Royal Thai Police arrested 90 people and about 100 scam victims were rescued. It calls for policy that recognises the cross-border nature of scams.", "k": "tx"}, {"d": "2026-11-18", "ch": "StockInvest.us", "id": "tYqhW2PDlvs", "t": "META Meta Platforms Stock Analysis: 5 Risks After Debt Flags + Thursday Predicted Opening Price? 🚨", "s": "Transcript: automated recap of the 18 Nov close ($616.38, −0.4%, third straight decline; range $610.30–$620.81). It flags signed leases and non-cancellable commitments as the main risk and mentions UBS's Buy initiation. The model still rates META a short-term 'sell candidate' and expects the next Q4 report around 27 Jan 2027 (its estimate). This is retail model output, not research.", "k": "tx"}, {"d": "2026-11-18", "ch": "Stocks News Daily", "id": "56xqh60ld9I", "t": "Muse AI agent launches in Australia with paid plans - Meta | Nov 18, 2026", "s": "Transcript: recap of Muse's Australian launch (free for most uses, paid plans; partners include Canva and Officeworks; AI glasses 'coming soon'). It cites Barchart saying Muse is not yet making money and that Muse reached 10m US downloads in its first 40 days, against ~3.7m for ChatGPT.", "k": "tx"}, {"d": "2026-11-17", "ch": "United States Court of Appeals for the Ninth Circuit", "id": "FPtD6tAqE0k", "t": "25-7916 Wilkinson, et al. v. Meta Platforms, Inc., et al.", "s": "Transcript: oral argument on whether Section 230 shields Meta, Google and Apple from gambling claims over third-party social-casino apps. Defendants argued the claims would force them to monitor and suppress third-party content, citing Calise and Doe 1 v. Meta. The case was submitted after argument.", "k": "tx"}, {"d": "2026-11-17", "ch": "National Post", "id": "154V8j_2fD8", "t": "Meta would consider pulling WhatsApp from Canada over ‘lawful access’ bill", "s": "Transcript: clip of Meta's Senate committee testimony on Bill C-22. Meta said it is committed to offering secure messaging in Canada, but building an encryption backdoor for law enforcement is 'technically infeasible' without it being exploited by criminals and hostile states. Asked whether it would keep serving Canada, Meta said it 'would need to review all of our options' and pointed to Apple withdrawing affected services in the UK: 'we would need to consider the same option.'", "k": "tx"}, {"d": "2026-11-17", "ch": "Bloomberg Podcasts", "id": "cBPMncIvwBE", "t": "Nvidia Delivers Solid Outlook in First Post-Huang Earnings", "s": "Transcript: Bloomberg's live read of Nvidia's results for Meta's main GPU supplier. Revenue was $115.8bn and data centre revenue $107.6bn, both above estimates; Q4 revenue is guided at about $126.1–133.9bn after a correction. Anchors noted Nvidia's commitments rose to $390bn from $279bn and an added $150bn buyback, with shares up ~2–4% after hours. Bloomberg Intelligence's Mandeep Singh flagged the lower Q4 gross-margin guide (71–72%) and the lack of a fiscal 2028 guide in the release.", "k": "tx"}, {"d": "2026-11-17", "ch": "Steve Eisman", "id": "xzgUgK5bqbQ", "t": "Meta's $27B Data Center Isn't on Its Balance Sheet", "s": "Transcript (auto-captions): Eisman argues that the off-balance-sheet SPV financing of Meta's ~$27bn Hyperion data centre is 'fancy footwork that doesn't pass the smell test', likening it to Enron- and GFC-era vehicles. He notes that Meta owns only 20% of the vehicle yet is building the centre, has agreed to rent it for 20 years and bears the cost of delays, while the debt stays off its balance sheet. This is an analyst opinion; Meta has defended the structure.", "k": "tx"}, {"d": "2026-11-17", "ch": "StockInvest.us", "id": "48w0oi6d1ow", "t": "META Meta Platforms: UBS Sees 30% Upside - 5 Price Scenarios & Wednesday Predicted Opening Price", "s": "Transcript: automated technical recap of the 17 Nov close ($618.87, −1.2%) and UBS's Buy/$815. The model rates META a short-term 'sell candidate' with support near $612 and resistance near $620 and $632; it cites the Instagram Direct test and Q4 results expected around 27 Jan (estimate, not confirmed by Meta). Low-signal quant content.", "k": "tx"}, {"d": "2026-11-16", "ch": "Meta", "id": "KsjEDVroCCI", "t": "Richland Parish", "s": "Transcript: Meta-produced community video on its Hyperion data-centre town in Louisiana. Residents and local business owners describe new jobs and local hiring (a caterer said it went from serving 40 people to 400 a week), and teachers describe retention bonuses funded through Meta's investment. A PR piece, released as the Entergy power-plant and transmission cases continue; no new figures. Upload date approximate (~16 Nov).", "k": "tx"}, {"d": "2026-11-16", "ch": "Meta", "id": "tEXlSuqhk3w", "t": "America's Workforce Academy: Dina Powell McCormick and Mike Rowe", "s": "Transcript: promo for Meta's skilled-trades programme (launched in June) for data-centre construction. Meta says the five-week course covers training, transport and food, and graduates leave with a credential and a guaranteed job; President Dina Powell McCormick appears with Mike Rowe. No new figures. Upload date approximate (~16 Nov).", "k": "tx"}, {"d": "2026-11-16", "ch": "United States Court of Appeals for the Ninth Circuit", "id": "KiKipnPip5w", "t": "25-7657 DZ Reserve, et al. v. Meta Platforms, Inc.", "s": "Transcript: oral argument on Meta's appeal of Judge Donato's ruling that it waived arbitration against more than 9 million advertisers in the 'potential reach' class action. Meta's counsel argued it invoked arbitration at the first available opportunity and expressly reserved the right at class certification; he said about 80% of the class is covered by arbitration clauses and about 20% has none. The judges pressed him on why Meta had not moved earlier ('you kind of came late in the game') and on its post-certification summary-judgment filings. No ruling was given at the hearing.", "k": "tx"}, {"d": "2026-11-16", "ch": "Schwab Network", "id": "FMmhZoLac78", "t": "Eddie Yoon on Personal AI's Rise, META Muse & Outlook for Agents", "s": "Description: Category Pirates co-founder Eddie Yoon on why personal AI could be the next big consumer-tech category, Meta's opportunity with its Muse agent, what could drive wide adoption, and which business models may win. Captions could not be retrieved (YouTube rate-limited our server), so no claims beyond the description are given.", "k": "desc"}, {"d": "2026-11-16", "ch": "NTV Kenya", "id": "T9NrimpXA7M", "t": "Meta glasses spark privacy fears in Kenya as content moderators allege rights violations", "s": "Transcript: report on people in Kenya being filmed without consent with Meta AI glasses (one case cited under Kenya's 2019 Data Protection Act). Kenyan advocacy group Oversight Lab Africa accuses Meta of privacy violations and of exploiting outsourced data workers who label glasses footage. Former content moderators describe psychological harm, citing a report by the rights group Equidem that found more than 60 workers with severe mental-health effects. It is a reputational and regulatory issue for AI glasses; no Meta response was included.", "k": "tx"}, {"d": "2026-11-15", "ch": "Lenny's Podcast", "id": "WY0cdD4gNoQ", "t": "Why Meta’s Muse worked: The story behind the number one app this year | Mona Sarantakos (Meta VP)", "s": "Transcript (via SignalCast transcript/summary): MSL VP of Product Mona Sarantakos, in her first podcast, says Muse grew out of a weekend with OpenClaw on a Raspberry Pi and waited seven months to launch because 'trust is a must' for an agent with email, calendar and purchase access. The team gates releases on 100+ layered evals (safety evals cannot be traded off), uses agent swarms to mine conversation data, built Muse with four PMs and a core team of under 100, and kept the Jolly avatar over a corporate logo. Next step: Muse on glasses and Muse Charm devices. No new usage or revenue figures.", "k": "tx"}, {"d": "2026-11-15", "ch": "WION", "id": "GxNO4aIqUIU", "t": "Italy Fines META 805 Million Euros Over Photo Access | WION News", "s": "Description: news segment on the Italian data-protection authority's €805m fine against Meta over the Facebook Android gallery feature (see 14 Nov in What's new; CNBC/Reuters have the details: 60 days to switch it off by default, Meta to appeal).", "k": "desc"}, {"d": "2026-11-15", "ch": "Mint", "id": "StKcypOxRJk", "t": "Zuckerberg Faces New $900 Million Nightmare: Why Italy Is Taking On Meta | Explained", "s": "Description: explainer on the €805m (~$887m) Italian privacy fine over Facebook's Android photo-gallery access. Captions could not be retrieved (YouTube blocked transcript requests from our server), so there is no transcript-based summary.", "k": "desc"}, {"d": "2026-11-12", "ch": "moneycontrol", "id": "DMnTlQtmhs4", "t": "Tech3: India AI reaction to Jensen Huang affairs, Meta Muse coming to India next year and more", "s": "Transcript: Moneycontrol's Tech3 podcast says Meta India head Arun Srinivas called bringing Muse to India a priority for next year, and that Meta is making a serious push into WhatsApp payments in India now that earlier user-acquisition limits have mostly gone, with CRED founder Kunal Shah leading WhatsApp globally. The episode also covers Indian worries about tighter US AI-chip export checks after the Nvidia CEO scandal.", "k": "tx"}, {"d": "2026-11-12", "ch": "Marpipe", "id": "2qBvlmCGTPw", "t": "Meta Just Changed How Muse Recommends Products", "s": "Transcript: catalog-software vendor Marpipe says it is a launch partner for 'Open Catalogs', a Meta programme still in testing that lets brands feed structured, real-time product catalogs straight into Muse so their products show up more often in its shopping recommendations, instead of relying on web crawling. It says Muse's average order value is over $200. This is a partner's claim; Meta has not published any documentation.", "k": "tx"}, {"d": "2026-11-12", "ch": "Stock News Daily", "id": "-4BKEKEZMaU", "t": "United blocks AI booking agents as stock falls about 2% - Meta | Nov 12, 2026", "s": "Transcript: recaps United Airlines' block on third-party AI booking agents (security, payment-credential and federal check-in rules), which the New York Post linked to Meta's ~2% drop to ~$628 on 11 Nov because it removes a showcase Muse use case. Fares stay visible on Kayak, Hopper and Google Flights.", "k": "tx"}, {"d": "2026-11-12", "ch": "一句英文 One Sentence English", "id": "2d_Sbm3TM5o", "t": "Alexandr Wang: Meta's AI Looked Like \"Damaged Goods\" When I Joined", "s": "Transcript (re-upload of Alexandr Wang's October David Senra interview): Wang says Muse began as a one-to-two-week prototype shown to the board in February 2026 and was built by under 200 people across models and product over seven months; launch was gated on a list of 100+ behaviours, first all green with a specially trained Muse Spark 1.3. He has 200+ direct reports in a deliberately flat MSL and said Meta's AI looked like 'damaged goods' when he joined after Llama 4. Not new news; an older interview resurfacing.", "k": "tx"}, {"d": "2026-11-12", "ch": "Atlas Berry", "id": "WHHgCjRXeLQ", "t": "Mark Zuckerberg wrote the check before he saw the model", "s": "Transcript (commentary on the October Cheeky Pint interview with John Collison): replays Zuckerberg saying Meta was writing a '$100bn or $200bn' compute check before seeing the models and asking Wang if it would work; adds Wang's account that CFO Susan Li stressed at an offsite how bad it would be if the bet failed. Older interview, recirculating.", "k": "tx"}, {"d": "2026-11-11", "ch": "Matteo311", "id": "EVyEi2X3Oao", "t": "Is this the TINY leap VR needed? Meta VR Glasses Hands On", "s": "Description: Creator hands-on with Meta VR Glasses (the 5K micro-OLED device Meta says launches in spring 2027). Captions could not be pulled this run (YouTube blocked transcript requests); summary from title only.", "k": "desc"}, {"d": "2026-11-11", "ch": "Kamifi Lab", "id": "AoKWESJuwZo", "t": "6 stock moves explained: Nvidia, Hims, CoreWeave, Tesla, Meta | Kamifi Lab", "s": "Description: Daily stock-move roundup that includes Meta on 11 Nov (close $628.77, −1.97%, on the day its infrastructure-chief departure was reported). Captions unavailable this run; summary from title only.", "k": "desc"}, {"d": "2026-11-11", "ch": "Matthew Berman", "id": "FCmLuTENOp0", "t": "Gemini Carbon, NVIDIA CEO AFFAIR, Fable 5.2, Meta Muse Ember, GPT Image 2.6, Minimax H3: AI NEWS", "s": "Description: AI news roundup (~84k views in 12 hours) covering Meta's Muse Ember small model alongside other launches. Captions unavailable this run; summary from title only.", "k": "desc"}, {"d": "2026-11-09", "ch": "Bloomberg Podcasts", "id": "KNx4YBrThrw", "t": "Closing Bell: Big Tech Rallies, Skydance Reports, Nvidia Plunges on CEO's Spy Scandal | Stock Movers", "s": "Transcript: Bloomberg's closing Stock Movers notes Meta was up more than 5% as the Magnificent Seven rallied (Nvidia the exception, on its CEO probe); hosts cite commentary that the recent tech selloff looked like a reset rather than the start of a structural downturn in the AI investment cycle, while concentrated positioning and high expectations remain risks.", "k": "tx"}, {"d": "2026-11-09", "ch": "The Contextian", "id": "9-QjF5_mUaQ", "t": "Meta's Muse Ember ties Claude Haiku 5.5's best score for a third of the cost", "s": "Transcript: explainer on Muse Ember — Artificial Analysis Intelligence Index 36, same as Claude Haiku 5.5 at max, for ~$0.14 per task vs $0.41 (GPT-6 Luna $0.15 but 8 points lower); $0.10/$0.50 per M tokens, 1M context; widest lead on AutomationBench-AA (37.8 vs 13.9), Haiku still ahead on FrontierCode; notes it is verbose (115M output tokens on the index) and pitched as the worker under Muse Wonder.", "k": "tx"}, {"d": "2026-11-08", "ch": "BBC News", "id": "MxvXe1t2QFk", "t": "Is Meta building an AI robot for your home? | BBC News", "s": "Transcript: BBC AI Decoded discusses reports that Meta built a humanoid robot prototype called Max in about three months with a Shanghai robot maker, with a second version in development, as a possible body for Muse. Critic Ed Zitron argues Meta is not becoming a robot company and that LLM-controlled robots face hard dexterity problems; Niantic Spatial co-founder John Hanke joins the panel. Meta itself calls the work internal research.", "k": "tx"}, {"d": "2026-11-08", "ch": "NDTV", "id": "NAr2UWKwBk0", "t": "Meta Is Building A Humanoid AI Robot Called MAX | Zuckerberg's Big AI Bet", "s": "Transcript: recaps the report that Meta built a ~5 ft humanoid prototype, code name Max, with China's Fourier in about three months (five-fingered hands, second version in the works) as a possible physical form for Muse; notes Meta says it is internal research with no plans to sell it, and raises liability questions for home robots.", "k": "tx"}, {"d": "2026-11-08", "ch": "Valentin - YouCanInvest", "id": "z9HQS5xbdKk", "t": "Meta is burning through its cash for the FIRST TIME since 2012", "s": "Transcript: walks through Q3 negative free cash flow (first since the 2012 IPO) and how the FY2026 capex guide kept rising through the year (January $115–135bn, April $125–145bn, July $130–145bn, now $135–145bn), weighing it against the ad engine and valuation.", "k": "tx"}, {"d": "2026-11-07", "ch": "Six Five Media", "id": "0lOIjIVcDG0", "t": "The Midterms Hit AI: Data Center Pushback, a Market Whipsaw, & Earnings That Tell a Different Story", "s": "Transcript: analyst discussion of the post-midterm AI selloff and local data-centre pushback; says Meta 'looked pretty good' in earnings with hyperscalers affirming capex, and highlights AMD's comment that Meta's agent workloads run on EPYC CPUs alongside Instinct GPUs.", "k": "tx"}];
 S.video=`<h1>${T('YouTube / video')}</h1><p class="sub">${T('Material Meta videos from the past ~2 weeks. Summaries from auto-captions where available (marked Transcript); otherwise from the video title and description (marked Description). No quotes are invented.')}</p><div class="card"><table><tr><th>${T('Date')}</th><th>${T('Channel')}</th><th>${T('Video')}</th><th>${T('Basis')}</th></tr>${VIDS.map(v=>`<tr><td style="white-space:nowrap">${v.d}</td><td>${v.ch}</td><td><a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${v.t}</a><div class="src" style="white-space:normal">${v.s}</div></td><td class="src">${T(v.k==='tx'?'Transcript':'Description')}</td></tr>`).join('')}</table></div>`;
 S.people=`<h1>${T('Key people')}</h1><p class="sub">${T('Verified quotes only: official transcripts, press releases and verified X accounts. Each is dated and linked.')}</p>`+['Mark Zuckerberg','Susan Li','Alexandr Wang'].map(p=>{const qs=D.quotes.filter(q=>q.who===p);return `<div class="card"><h2>${p} <span class="src">· ${qs[0].role}</span></h2>${qs.map(q=>`<div class="q"><div class="t">“${q.q}”</div><div class="m">${q.date} · ${lk(q.via,q.url)}</div></div>`).join('')}</div>`}).join('');
 const F=D.f13.funds,pers=[...new Set(F.flatMap(f=>f.points.map(p=>p.per)))].sort().slice(-8);
 const cell=(f,per)=>{const i=f.points.findIndex(p=>p.per===per),p=f.points[i];const note=(D.f13_notes[f.cik]||{})[per];if(!p)return `<td class="n"><span class="na" title="${note||''}">${note?'13F-NT':T('n/a')}</span></td>`;const pv=f.points[i-1];let ch='';if(pv){const d=p.shares-pv.shares;ch=pv.shares===0&&p.shares>0?`<div class="pos">${T('New')}</div>`:p.shares===0&&pv.shares>0?`<div class="neg">${T('Sold out')}</div>`:d?`<div class="${d>0?'pos':'neg'}">${d>0?'+':''}${fmtN(d)}</div>`:'<div class="src">0</div>'}
  return `<td class="n">${p.shares?`<a href="${p.url}" target="_blank">${fmtN(p.shares)}</a><div class="src">$${(p.value/1e6).toFixed(0)}m</div>`:`<span class="na">${T('Not held')}</span>`}${ch}${p.options.length?`<div class="src" style="white-space:normal">${T('Options')}: ${['Call','Put'].map(k=>{const t=p.options.filter(o=>o[0].toLowerCase()===k.toLowerCase()).reduce((a,o)=>a+o[1],0);return t?k+' '+(t/1e6).toFixed(2)+'m sh':''}).filter(Boolean).join(' · ')}</div>`:''}</td>`};
 S['13f']=`<style>main{max-width:1900px}</style><h1>${T('13F hedge funds')}</h1><p class="sub">SEC EDGAR Form 13F-HR information tables, CUSIP ${D.f13.cusip}. Share counts and reported value are <b>as of each quarter-end</b> (filed up to 45 days later). Q3 2026 13Fs are due 14 Nov 2026.</p>
 <div class="card"><h2>${T('META shares held by quarter (as of quarter-end)')}</h2><div class="cw" style="height:380px"><canvas id="c4"></canvas></div>${SRC('f13')}</div>
 <div class="card" style="overflow-x:auto;max-width:none"><table><tr><th>${T('Fund')}</th>${pers.map(p=>`<th class="n">${ql(p)}<div class="src">as of ${p}</div></th>`).join('')}</tr>${F.map(f=>`<tr><td style="min-width:150px"><b>${f.name}</b><div class="src">CIK ${f.cik}</div></td>${pers.map(p=>cell(f,p)).join('')}</tr>`).join('')}</table>

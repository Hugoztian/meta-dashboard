<script>
const D=window.META_DATA,L=()=>'en',T=s=>s;
Chart.defaults.devicePixelRatio=Math.max(2,window.devicePixelRatio||1);Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
const TABS=[['overview','Overview'],['financials','Financials'],['compute','AI compute'],['muse','Muse & AI products'],['people','Key people'],['video','YouTube / video'],['risks','Legal & regulatory'],['13f','13F hedge funds']];
const fmtB=v=>v==null?`<span class="na">${T('n/a')}</span>`:'$'+(v/1e9).toFixed(2)+'bn',fmtN=n=>n.toLocaleString('en-US'),na=()=>`<span class="na">${T('n/a')}</span>`;
const lk=(s,u)=>u?`<a href="${u}" target="_blank" rel="noopener">${s}</a>`:s,ql=d=>{const m={'03-31':'Q1','06-30':'Q2','09-30':'Q3','12-31':'Q4'};return m[d.slice(5)]+' '+d.slice(0,4)};

const SRCS={seg:['SEC 10-Q/10-K XBRL (segment note)','https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json'],capex:['SEC EDGAR XBRL companyfacts','https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json'],kpi:['Meta quarterly earnings releases','https://investor.atmeta.com/financials/default.aspx'],cf:['SEC EDGAR XBRL companyfacts','https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json'],f13:['SEC EDGAR 13F-HR filings','https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&type=13F-HR'],
 guide:['Meta earnings releases (Jan/Apr/Jul/Oct 2026)','https://investor.atmeta.com/investor-news/default.aspx'],gw:['Meta Data Centers, Q2 2026 call, AMD 8-K','https://datacenters.atmeta.com/2026/07/deepening-our-investment-in-richland-parish-louisiana/']};
const SRC=k=>`<p class="src">${'Source'}: ${lk(SRCS[k][0],SRCS[k][1])}</p>`;
let FS_TAB='is';
function FSTAB(){const S=D.fs,C=S.cols,isEps=l=>/EPS/.test(l),isSh=l=>/shares/.test(l);
 const fmt=(l,v)=>v==null?na():isEps(l)?'$'+v.toFixed(2):isSh(l)?(v/1e9).toFixed(3)+'bn':(v<0?'−':'')+'$'+(Math.abs(v)/1e9).toFixed(2)+'bn';
 const rows=S[FS_TAB],tabs=[['is','Income Statement'],['bs','Balance Sheet'],['cf','Cash Flow']];
 return `<div class="card" style="overflow-x:auto"><div style="display:flex;gap:6px;margin-bottom:12px">${tabs.map(([k,n])=>`<button onclick="FS_TAB='${k}';render()" style="border:0;border-radius:980px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px;${k===FS_TAB?'background:var(--accsoft);color:var(--acc);font-weight:600':'background:transparent;color:var(--txt)'}">${T(n)}</button>`).join('')}</div>
 <table><tr><th>${FS_TAB==='bs'?'As of quarter-end':'Quarter'}</th>${C.map(c=>{const a=S.acc[c]||{};return `<th class="n">${lk(ql(c),a.url)}<div class="src" style="white-space:nowrap">${a.form||''} · ${a.filed||'n/a'}</div></th>`}).join('')}</tr>
 ${rows.map(r=>`<tr><td style="min-width:250px">${T(r[0])}</td>${r.slice(1).map((v,i)=>`<td class="n">${a_(C[i],fmt(r[0],v))}</td>`).join('')}</tr>`).join('')}</table>
 <p class="src">${'Source'}: ${lk('SEC EDGAR XBRL companyfacts, CIK 1326801','https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json')}; ${'each column header and figure links to the 10-Q/10-K that reported it'}. ${FS_TAB==='bs'?'Balance sheet items are point-in-time at quarter-end.':'Q4 flow items = full year − 9-month YTD. Q4 EPS and diluted shares cannot be derived by subtraction and show n/a (see the 10-K).'} ${'Q3 2026 is added once the 10-Q is filed.'}</p></div>`}
function a_(c,t){const a=D.fs.acc[c];return a?`<a href="${a.url}" target="_blank" rel="noopener" style="color:inherit">${t}</a>`:t}
function FIN(){const F=D.fin,b=v=>v==null?na():(v<0?'−':'')+'$'+(Math.abs(v)/1e9).toFixed(2)+'bn',p=v=>v==null?na():(v>0?'+':'')+v+'%';
return `<h1>${T('Financials')}</h1><p class="sub">Segments from 10-Q/10-K XBRL (Q4 = FY − 9M); cash-flow items from XBRL companyfacts; DAP, ad metrics and headcount from Meta earnings releases. FCF = operating cash flow − purchases of P&E − finance-lease principal (Meta's definition). ARPP is published only in Meta's earnings slides and is not included yet (n/a).</p>
${FSTAB()}
<div class="two"><div class="card"><h2>${T('Segments: revenue')}</h2><div class="cw"><canvas id="f1"></canvas></div>${SRC('seg')}</div><div class="card"><h2>${T('Segments: operating income')}</h2><div class="cw"><canvas id="f2"></canvas></div>${SRC('seg')}</div></div>
<div class="two"><div class="card"><h2>${T('Ad metrics (y/y)')}</h2><div class="cw"><canvas id="f3"></canvas></div>${SRC('kpi')}</div><div class="card"><h2>${T('Free cash flow, buybacks & dividends')}</h2><div class="cw"><canvas id="f4"></canvas></div>${SRC('cf')}</div></div>
<div class="card" style="overflow-x:auto"><table><tr><th>Quarter</th><th class="n">FoA rev</th><th class="n">FoA op inc</th><th class="n">RL rev</th><th class="n">RL op loss</th><th class="n">DAP (bn)</th><th class="n">Ad impr. y/y</th><th class="n">Price/ad y/y</th><th class="n">Total costs & exp.</th><th class="n">Headcount</th><th class="n">Capex+FL</th><th class="n">FCF</th><th class="n">Buybacks</th><th class="n">Dividends</th></tr>
${F.slice().reverse().map(r=>`<tr><td>${lk(ql(r.q),r.pr)}</td><td class="n">${b(r.FoA_rev)}</td><td class="n">${b(r.FoA_op)}</td><td class="n">${b(r.RL_rev)}</td><td class="n neg">${b(r.RL_op)}</td><td class="n">${r.dap??na()}</td><td class="n">${p(r.imp)}</td><td class="n">${p(r.ppa)}</td><td class="n">${b(r.opex)}</td><td class="n">${r.hc?fmtN(r.hc):na()}</td><td class="n">${b(r.capex+(r.fl||0))}</td><td class="n">${b(r.fcf)}</td><td class="n">${b(r.buyback)}</td><td class="n">${b(r.div)}</td></tr>`).join('')}</table>
<p class="src">${lk('SEC EDGAR XBRL, CIK 1326801','https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json')} · quarter links open the Meta earnings release · Expense guide FY2026: $175–179bn (Q3 2026, raised from $165–169bn). Q3 2026 column from the 8-K press release (Ex. 99.1); 10-Q filed 22 Oct 2026 (figures not yet re-pulled from XBRL). Capex guidance vs actual: see AI compute tab.</p></div>`}
function finCharts(){const F=D.fin,L=F.map(r=>ql(r.q)),o={maintainAspectRatio:false,animation:false},g=id=>document.getElementById(id);if(!g('f1'))return;
g('f1')&&charts.push(new Chart(g('f1'),{type:'bar',data:{labels:L,datasets:[{label:'Family of Apps',data:F.map(r=>r.FoA_rev/1e9),backgroundColor:'#0081FB'},{label:'Reality Labs',data:F.map(r=>r.RL_rev/1e9),backgroundColor:'#7B2FD6'}]},options:{...o,scales:{x:{stacked:true},y:{stacked:true,title:{display:true,text:'US$bn'}}}}}));
g('f2')&&charts.push(new Chart(g('f2'),{type:'bar',data:{labels:L,datasets:[{label:'Family of Apps',data:F.map(r=>r.FoA_op/1e9),backgroundColor:'#0081FB'},{label:'Reality Labs',data:F.map(r=>r.RL_op/1e9),backgroundColor:'#7B2FD6'}]},options:{...o,scales:{y:{title:{display:true,text:'US$bn'}}}}}));
g('f3')&&charts.push(new Chart(g('f3'),{type:'line',data:{labels:L,datasets:[{label:'Ad impressions y/y %',data:F.map(r=>r.imp),borderColor:'#0081FB',backgroundColor:'#0081FB'},{label:'Avg price per ad y/y %',data:F.map(r=>r.ppa),borderColor:'#7B2FD6',backgroundColor:'#7B2FD6'},{label:'DAP (bn, right)',data:F.map(r=>r.dap),borderColor:'#6e6e73',backgroundColor:'#6e6e73',yAxisID:'y2'}]},options:{...o,scales:{y:{title:{display:true,text:'%'}},y2:{position:'right',grid:{display:false}}}}}));
g('f4')&&charts.push(new Chart(g('f4'),{type:'bar',data:{labels:L,datasets:[{label:'Free cash flow',data:F.map(r=>r.fcf/1e9),backgroundColor:'#0081FB'},{label:'Buybacks',data:F.map(r=>r.buyback/1e9),backgroundColor:'#7B2FD6'},{label:'Dividends',data:F.map(r=>r.div/1e9),backgroundColor:'#9aa0a6'}]},options:{...o,scales:{y:{title:{display:true,text:'US$bn'}}}}}));}
function PREVIEW(){return `<h2>${T('Q3 2026 earnings: results vs expectations')} <span class="src">· ${D.preview.date}, ${D.preview.time} · ${lk('Meta IR',D.preview.date_src)}</span></h2><table><tr><th>${T('Metric')}</th><th>${T('Company guidance')}</th><th>${T('Consensus')}</th><th>${T('Actual')}</th></tr>${D.preview.rows.map(r=>`<tr><td><b>${T(r.k)}</b></td><td>${r.guide}</td><td>${r.cons==='n/a'?na():r.cons}</td><td>${r.actual??'<span class="na">pending</span>'}${r.v?` <b style="color:${/beat|better|above/.test(r.v)?'#1a9f53':/miss|worse/.test(r.v)?'#d93025':'var(--mut,#888)'}">· ${T(r.v)}</b>`:''}</td></tr>`).join('')}</table>${D.preview.reaction?`<p><b>${T('Stock reaction')}:</b> ${D.preview.reaction}</p>`:''}${D.preview.actual_src?`<p class="src">Actuals: ${D.preview.actual_src.map(x=>lk(x[0],x[1])).join(' · ')}</p>`:''}<p class="src">Consensus: ${D.preview.srcs.map(x=>lk(x[0],x[1])).join(' · ')}. Estimates differ by provider; shown as reported.</p>`}
function cdText(t){let s=Math.max(0,Math.floor((t-new Date())/1000));const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);s-=m*60;const u=['d','h','m','s'];return s+d+h+m===0?'Out':`${d}<small>${u[0]}</small>${String(h).padStart(2,'0')}<small>${u[1]}</small>${String(m).padStart(2,'0')}<small>${u[2]}</small>${String(s).padStart(2,'0')}<small>${u[3]}</small>`}
setInterval(()=>{const e=document.getElementById('ercd');if(e)e.innerHTML=cdText(new Date('2026-10-21T16:00:00-04:00'))},1000);
function tvChart(){const el=document.getElementById('tvchart');if(!el)return;const box=document.createElement('div');box.className='tradingview-widget-container';box.style.height='100%';const w=document.createElement('div');w.className='tradingview-widget-container__widget';w.style.height='100%';box.appendChild(w);
 const sc=document.createElement('script');sc.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';sc.async=true;sc.textContent=JSON.stringify({autosize:true,symbol:'NASDAQ:META',interval:'D',range:'6M',timezone:'Asia/Singapore',theme:isDark()?'dark':'light',style:'1',locale:'en',allow_symbol_change:false,hide_side_toolbar:true,calendar:false,backgroundColor:isDark()?'rgba(22,22,23,1)':'rgba(255,255,255,1)'});
 sc.onerror=()=>{el.innerHTML='<span class="na">Live chart unavailable</span>';el.style.height='auto'};box.appendChild(sc);el.appendChild(box)}
let charts=[];
function render(){charts.forEach(c=>c.destroy());charts=[];let tab=(location.hash.slice(1)||'overview');if(tab==='strategy')tab='muse';
 document.getElementById('nav').innerHTML=TABS.map(([k,n])=>`<a href="#${k}" class="${k===tab?'on':''}">${T(n)}</a>`).join('');
 const S={};
 S.overview=`<div class="hero"><h1>Meta Platforms <span class="tk">$META</span> ${'Dashboard'}</h1><div class="src">${T('Built')} ${D.built_sgt} SGT · © 2026 Hugo Tian</div>
 <div class="h4"><div class="hcard"><div class="l"><i class="livedot"></i> ${T('Live price')} <span style="margin-left:auto">META · Nasdaq</span></div><div id="lq">${quoteHTML()}</div></div>
 <div class="hcard"><div class="l">${T('Q3 2026 results')}</div><div class="v">${'Beat'}</div><div class="ch pos">${'Rev $64.60bn vs $63.34bn est. · AH ~+2–4%'}</div><div class="s">EPS $3.83 ($7.40 ex-charge) · Q4 guide $73–76bn · ${lk('Meta Q3 release',D.ov_src)}</div><div class="asof"><a href="#overview" onclick="document.getElementById('cat').scrollIntoView();return false">${T('Catalyst calendar')} →</a></div></div>
 <div class="hcard"><div class="l">${T('Market cap')}</div><div class="v" id="mcap">${Q.d?Q.d.mktcapView:'—'}</div><div class="ch" style="color:var(--mut)" id="pe">${peHTML()}</div><div class="s" id="shout">${T('Shares out')} ${Q.d?Q.d.sharesout:'—'}</div><div class="asof">${'CNBC quote feed (live) · '+lk('CNBC','https://www.cnbc.com/quotes/META')+' · P/E = price ÷ EPS (CNBC: TTM EPS, forward EPS)'}</div></div>
 <div class="hcard"><div class="l">${T('Q3 2026 revenue')}</div><div class="v">$64.60bn</div><div class="ch pos">+26% y/y</div><div class="s">FoA op. income $17.12bn (after $9.89bn legal charge) · RL loss −$4.13bn</div><div class="asof">${lk('Q2 2026 release, 29 Jul 2026',D.ov_src)}</div></div></div>
 <div class="h2row"><div class="mini"><div class="l">${T('FY2026 capex guide')}</div><div class="v">$135–145bn</div><div class="s">Q3 actual $34.91bn · ${lk('Meta Q3 release',D.ov_src)} · <a href="#compute">${T('AI compute')}</a></div></div>
 <div class="mini"><div class="l">${T('Family DAP (Jun 2026)')}</div><div class="v">3.60bn</div><div class="s">+3% y/y · ${lk('Meta Q2 release',D.ov_src)} · <a href="#financials">${T('Financials')}</a></div></div>
 <div class="mini"><div class="l">${T('Latest Muse model')}</div><div class="v">Muse Wonder</div><div class="s">12 Oct 2026 · ${lk('Meta AI','https://research.meta.ai/blog/muse-wonder')} · <a href="#muse">${T('Muse & AI products')}</a></div></div>
 <div class="mini"><div class="l">${T('Q3 2026 free cash flow')}</div><div class="v">−$2.12bn</div><div class="s">CFO $32.79bn − capex $33.94bn − leases $0.96bn · ${lk('Meta Q3 release',D.ov_src)}</div></div></div></div>
 <h1>${T('Overview')}</h1>

const Q={d:null,err:null,at:null,prev:null};
const QURL='https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=META&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1';
const sgt=ms=>new Date(ms).toLocaleString('en-GB',{timeZone:'Asia/Singapore',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const STAT={REG_MKT:['Regular session'],PRE_MKT:['Pre-market'],POST_MKT:['After hours'],CLOSED:['Market closed']};
function peHTML(){const q=Q.d;if(!q)return 'P/E — · '+'fwd'+' P/E —';const n=v=>{const x=parseFloat(v);return isFinite(x)?x:null},px=livePx()??n(q.last),te=n(q.eps),fe=n(q.feps);
 const pe=(px&&te?px/te:n(q.pe)),fpe=(px&&fe?px/fe:n(q.fpe)),f=v=>v==null?'n/a':v.toFixed(1)+'x';
 return `${'P/E'} ${f(pe)}${te?` <span class="src">(EPS $${te})</span>`:''} · ${'fwd P/E'} ${f(fpe)}${fe?` <span class="src">(EPS $${fe})</span>`:''}`}
const WURL='https://micron-dashboard.cashcache.workers.dev/api/quote?symbol=META';/* Micron shared Worker (Robinhood 24_5); CNBC direct is fallback */const W={d:null,err:null,at:0};
function livePx(){return W.d?W.d.main.price:(Q.d?parseFloat(Q.d.last):null)}
function quoteHTML(){
 if(W.d){const w=W.d,m=w.main,c=+m.change,cls=c>=0?'pos':'neg',sg=c>=0?'+':'',rg=w.regular||{},pc=w.prev_close||{};
  return `<div class="lq"><span class="px">$${m.price.toFixed(2)}</span><span class="ch ${cls}">${sg}${c.toFixed(2)} (${sg}${(+m.pct).toFixed(2)}%)</span><span class="badge" style="padding:2px 8px;border-radius:10px;border:1px solid var(--mut);font-size:12px">${m.label}</span><span class="src">${'Regular close'} $${rg.price!=null?rg.price.toFixed(2):'—'}${pc.price!=null?` · ${'prev close'} $${pc.price.toFixed(2)} (${pc.date})`:''}</span></div>
 <p class="src">${'Updated'} ${sgt(W.at)} SGT · ${'quote time'} ${m.time_et} · ${'Source'}: <a href="https://robinhood.com/stocks/META" target="_blank" rel="noopener">Robinhood</a> ${'via'} <a href="${WURL}" target="_blank" rel="noopener">${'Micron shared quote Worker'}</a> (${w.source_note}) · ${'refreshes every 15 s'}${W.err?' · last good update, retrying':''}</p>`}
 if(!Q.d)return `<span class="na">${Q.err?'Live quote unavailable, retrying':'Loading live quote…'}</span>`;
 const q=Q.d,c=parseFloat(q.change),cls=c>=0?'pos':'neg',st=STAT[q.curmktstatus]||[q.curmktstatus,q.curmktstatus],x=q.ExtendedMktQuote;
 return `<div class="lq"><span class="px">$${q.last}</span><span class="ch ${cls}">${q.change} (${q.change_pct})</span><span class="src">${st[0]}${x?` · ${STAT[x.type]?STAT[x.type][0]:x.type} $${x.last} <span class="${parseFloat(x.change)>=0?'pos':'neg'}">${x.change} (${x.change_pct})</span>`:''}</span></div>
 <p class="src">${'Updated'} ${sgt(Q.at)} SGT · ${'last trade date'} ${q.last_timedate} · ${'Source'}: <a href="https://www.cnbc.com/quotes/META" target="_blank" rel="noopener">CNBC quote feed</a> (${q.source}; ${q.realTime==='true'?'real-time':'may be delayed'}) · ${'refreshes every 15 s'}${Q.err?' · last good update, retrying':''}</p>`}
async function pollW(){if(!WURL)return;try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);const r=await fetch(WURL+'&t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(to);const j=await r.json();if(!j||!j.ok||!j.main||!j.main.price)throw new Error('bad');W.d=j;W.err=null;W.at=Date.now()}catch(e){W.err=String(e);if(Date.now()-W.at>60000)W.d=null}}
async function pollQuote(){await pollW();try{const r=await fetch(QURL,{cache:'no-store'});const j=await r.json();const q=j.FormattedQuoteResult.FormattedQuote[0];if(!q||!q.last)throw new Error('empty');Q.d=q;Q.err=null;Q.at=Date.now()}catch(e){Q.err=String(e)}const el=document.getElementById('lq');if(el)el.innerHTML=quoteHTML();const mc=document.getElementById('mcap');if(mc&&Q.d){mc.textContent=Q.d.mktcapView;const pe=document.getElementById('pe');if(pe)pe.innerHTML=peHTML();const so=document.getElementById('shout');if(so)so.textContent=T('Shares out')+' '+Q.d.sharesout}}
setInterval(()=>{if(!document.hidden)pollQuote()},15000);
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function applyTheme(){const t=document.documentElement.dataset.theme||'auto';document.getElementById('themelbl').textContent=t==='auto'?'Auto':t==='dark'?'Dark':'Light';document.getElementById('themeic').textContent=t==='auto'?'◐':t==='dark'?'☾':'☀';
 Chart.defaults.color=isDark()?'#a1a1a6':'#6e6e73';Chart.defaults.borderColor=isDark()?'rgba(255,255,255,.1)':'rgba(0,0,0,.08)'}
document.getElementById('themebtn').onclick=()=>{const h=document.documentElement,cur=h.dataset.theme||'auto',nx=cur==='auto'?(isDark()?'light':'dark'):cur==='dark'?'light':'auto';
 if(nx==='auto'){delete h.dataset.theme;try{localStorage.removeItem('meta-theme')}catch(e){}}else{h.dataset.theme=nx;try{localStorage.setItem('meta-theme',nx)}catch(e){}}applyTheme();render()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render()});
window.addEventListener('hashchange',render);applyTheme();render();pollQuote();
</script></body></html>

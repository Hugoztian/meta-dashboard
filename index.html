<script>
const D=window.META_DATA,L=()=>document.documentElement.dataset.lang,T=s=>(L()==='zh'&&window.ZH[s])||s;
Chart.defaults.devicePixelRatio=Math.max(2,window.devicePixelRatio||1);Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
const TABS=[['overview','Overview'],['financials','Financials'],['compute','AI compute'],['muse','Muse & AI products'],['people','Key people'],['risks','Legal & regulatory'],['13f','13F hedge funds']];
const fmtB=v=>v==null?`<span class="na">${T('n/a')}</span>`:'$'+(v/1e9).toFixed(2)+'bn',fmtN=n=>n.toLocaleString('en-US'),na=()=>`<span class="na">${T('n/a')}</span>`;
const lk=(s,u)=>u?`<a href="${u}" target="_blank" rel="noopener">${s}</a>`:s,ql=d=>{const m={'03-31':'Q1','06-30':'Q2','09-30':'Q3','12-31':'Q4'};return m[d.slice(5)]+' '+d.slice(0,4)};

function FIN(){const F=D.fin,b=v=>v==null?na():(v<0?'−':'')+'$'+(Math.abs(v)/1e9).toFixed(2)+'bn',p=v=>v==null?na():(v>0?'+':'')+v+'%';
return `<h1>${T('Financials')}</h1><p class="sub">Segments from 10-Q/10-K XBRL (Q4 = FY − 9M); cash-flow items from XBRL companyfacts; DAP, ad metrics and headcount from Meta earnings releases. FCF = operating cash flow − purchases of P&E − finance-lease principal (Meta's definition). ARPP is published only in Meta's earnings slides and is not included yet (n/a).</p>
<div class="two"><div class="card"><h2>${T('Segments: revenue')}</h2><div class="cw"><canvas id="f1"></canvas></div></div><div class="card"><h2>${T('Segments: operating income')}</h2><div class="cw"><canvas id="f2"></canvas></div></div></div>
<div class="two"><div class="card"><h2>${T('Ad metrics (y/y)')}</h2><div class="cw"><canvas id="f3"></canvas></div></div><div class="card"><h2>${T('Free cash flow, buybacks & dividends')}</h2><div class="cw"><canvas id="f4"></canvas></div></div></div>
<div class="card" style="overflow-x:auto"><table><tr><th>Quarter</th><th class="n">FoA rev</th><th class="n">FoA op inc</th><th class="n">RL rev</th><th class="n">RL op loss</th><th class="n">DAP (bn)</th><th class="n">Ad impr. y/y</th><th class="n">Price/ad y/y</th><th class="n">Total costs & exp.</th><th class="n">Headcount</th><th class="n">Capex+FL</th><th class="n">FCF</th><th class="n">Buybacks</th><th class="n">Dividends</th></tr>
${F.slice().reverse().map(r=>`<tr><td>${lk(ql(r.q),r.pr)}</td><td class="n">${b(r.FoA_rev)}</td><td class="n">${b(r.FoA_op)}</td><td class="n">${b(r.RL_rev)}</td><td class="n neg">${b(r.RL_op)}</td><td class="n">${r.dap??na()}</td><td class="n">${p(r.imp)}</td><td class="n">${p(r.ppa)}</td><td class="n">${b(r.opex)}</td><td class="n">${r.hc?fmtN(r.hc):na()}</td><td class="n">${b(r.capex+(r.fl||0))}</td><td class="n">${b(r.fcf)}</td><td class="n">${b(r.buyback)}</td><td class="n">${b(r.div)}</td></tr>`).join('')}</table>
<p class="src">${lk('SEC EDGAR XBRL, CIK 1326801','https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json')} · quarter links open the Meta earnings release · Opex guide FY2026: $165–169bn (Q2 2026). Capex guidance vs actual: see AI compute tab.</p></div>`}
function finCharts(){const F=D.fin,L=F.map(r=>ql(r.q)),o={maintainAspectRatio:false,animation:false},g=id=>document.getElementById(id);if(!g('f1'))return;
charts.push(new Chart(g('f1'),{type:'bar',data:{labels:L,datasets:[{label:'Family of Apps',data:F.map(r=>r.FoA_rev/1e9),backgroundColor:'#0081FB'},{label:'Reality Labs',data:F.map(r=>r.RL_rev/1e9),backgroundColor:'#7B2FD6'}]},options:{...o,scales:{x:{stacked:true},y:{stacked:true,title:{display:true,text:'US$bn'}}}}}));
charts.push(new Chart(g('f2'),{type:'bar',data:{labels:L,datasets:[{label:'Family of Apps',data:F.map(r=>r.FoA_op/1e9),backgroundColor:'#0081FB'},{label:'Reality Labs',data:F.map(r=>r.RL_op/1e9),backgroundColor:'#7B2FD6'}]},options:{...o,scales:{y:{title:{display:true,text:'US$bn'}}}}}));
charts.push(new Chart(g('f3'),{type:'line',data:{labels:L,datasets:[{label:'Ad impressions y/y %',data:F.map(r=>r.imp),borderColor:'#0081FB',backgroundColor:'#0081FB'},{label:'Avg price per ad y/y %',data:F.map(r=>r.ppa),borderColor:'#7B2FD6',backgroundColor:'#7B2FD6'},{label:'DAP (bn, right)',data:F.map(r=>r.dap),borderColor:'#6e6e73',backgroundColor:'#6e6e73',yAxisID:'y2'}]},options:{...o,scales:{y:{title:{display:true,text:'%'}},y2:{position:'right',grid:{display:false}}}}}));
charts.push(new Chart(g('f4'),{type:'bar',data:{labels:L,datasets:[{label:'Free cash flow',data:F.map(r=>r.fcf/1e9),backgroundColor:'#0081FB'},{label:'Buybacks',data:F.map(r=>r.buyback/1e9),backgroundColor:'#7B2FD6'},{label:'Dividends',data:F.map(r=>r.div/1e9),backgroundColor:'#9aa0a6'}]},options:{...o,scales:{y:{title:{display:true,text:'US$bn'}}}}}));}
let charts=[];
function render(){charts.forEach(c=>c.destroy());charts=[];let tab=(location.hash.slice(1)||'overview');if(tab==='strategy')tab='muse';
 document.getElementById('nav').innerHTML=TABS.map(([k,n])=>`<a href="#${k}" class="${k===tab?'on':''}">${T(n)}</a>`).join('');
 document.querySelectorAll('#lang .o').forEach(o=>o.classList.toggle('on',o.dataset.l===L()));
 const S={};
 S.overview=`<h1>${T('Overview')}</h1><p class="sub">${T('Built')} ${D.built_sgt} SGT · ${T('Not published · local preview')}</p>
 <div class="card"><h2>${T('Live price')} <span class="src">META · Nasdaq</span></h2><div id="lq">${quoteHTML()}</div></div>
 <div class="card"><h2>${T('What changed this week')}</h2><ul class="week">${D.week.map(w=>`<li><span class="d">${w.date}</span>${lk(w.txt,w.url)}</li>`).join('')}</ul></div>
 <div class="card"><h2>${T('Q3 2026 earnings preview')} <span class="src">· ${D.preview.date}, ${D.preview.time} · ${lk('Meta IR',D.preview.date_src)}</span></h2><table><tr><th>${T('Metric')}</th><th>${T('Company guidance')}</th><th>${T('Consensus')}</th><th>${T('Actual')}</th></tr>${D.preview.rows.map(r=>`<tr><td><b>${T(r.k)}</b></td><td>${r.guide}</td><td>${r.cons==='n/a'?na():r.cons}</td><td>${r.actual??'<span class="na">pending</span>'}</td></tr>`).join('')}</table><p class="src">Consensus: ${D.preview.srcs.map(x=>lk(x[0],x[1])).join(' · ')}. Estimates differ by provider; shown as reported.</p></div>
 <div class="card"><h2>${T('Key numbers (Q2 2026, Meta press release)')}</h2><div class="grid">${D.ov.map(o=>`<div class="kpi"><div class="k">${T(o.k)}</div><div class="v">${o.v}</div></div>`).join('')}</div><p class="src">${lk('Meta Q2 2026 press release (29 Jul 2026)',D.ov_src)}</p></div>
 <div class="card"><h2>${T('Quarterly capex (SEC XBRL)')}</h2><div class="cw"><canvas id="c0"></canvas></div></div>`;
 S.compute=`<h1>${T('AI compute')}</h1><p class="sub">Capex from SEC XBRL companyfacts (same tags/method as the NVDA dashboard); sites, GPUs and deals from company releases and filings.</p>
 <div class="card"><h2>${T('Quarterly capex (SEC XBRL)')}</h2><div class="cw"><canvas id="c1"></canvas></div>
 <table><tr><th>Quarter</th><th class="n">${T('Purchases of property & equipment')}</th><th class="n">${T('Finance-lease principal payments')}</th><th class="n">Total</th></tr>${D.capex.rows.slice().reverse().map(r=>`<tr><td>${ql(r[0])}</td><td class="n">${fmtB(r[1])}</td><td class="n">${fmtB(r[2])}</td><td class="n">${r[2]==null?na():fmtB(r[1]+r[2])}</td></tr>`).join('')}</table><p class="src">${lk('SEC EDGAR XBRL companyfacts, CIK 1326801',D.capex.src)} · Q4 = FY − 9M YTD</p></div>
 <div class="two"><div class="card"><h2>${T('FY2026 capex guidance history')}</h2><div class="cw" style="height:220px"><canvas id="c2"></canvas></div><table><tr><th>${T('Date')}</th><th>${T('Event')}</th><th class="n">${T('Range (US$bn)')}</th><th>${T('Source')}</th></tr>${D.guide.map(g=>`<tr><td>${g.date}${g.note?'*':''}</td><td>${g.ev}</td><td class="n">${g.lo}–${g.hi}</td><td>${lk(g.src,g.url)}</td></tr>`).join('')}</table><p class="src">* ${D.guide[1].note}. Q3 update due 21 Oct 2026 US time.</p></div>
 <div class="card"><h2>${T('GPU counts')}</h2><table>${D.gpu.map(g=>`<tr><td>${g.k}</td><td>${g.v.startsWith('n/a')?'<span class="na">'+g.v+'</span>':g.v}</td><td class="src">${lk(g.src,g.url)}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>${T('Data-centre power projects')}</h2><div class="cw" style="height:200px"><canvas id="c3"></canvas></div><table><tr><th>${T('Site')}</th><th>${T('Location')}</th><th>${T('Power')}</th><th>${T('Status')}</th><th>${T('Source')}</th></tr>${D.sites.map(s=>`<tr><td><b>${s.name}</b></td><td>${s.loc}</td><td class="n">${s.gw}</td><td>${s.status}</td><td class="src">${lk(s.src,s.url)}</td></tr>`).join('')}</table></div>
 <div class="card"><h2>${T('Compute deals')}</h2><table><tr><th>${T('Date')}</th><th>${T('Counterparty')}</th><th>${T('Deal')}</th><th class="n">GW</th><th class="n">${T('Value (US$bn)')}</th><th>${T('Source')}</th></tr>${D.deals.map(d=>`<tr><td>${d.date}</td><td><b>${d.who}</b></td><td>${d.what}</td><td class="n">${d.gw??na()}</td><td class="n">${d.val??na()}</td><td class="src">${lk(d.src,d.url)}</td></tr>`).join('')}</table></div>`;
 S.financials=FIN();S.strategy=`<div class="card"><h2>${T('AI products & strategy')}</h2><table>${D.strat.map(x=>`<tr><td style="width:180px"><b>${T(x.k)}</b></td><td>${x.v}</td><td class="src">${lk(x.src,x.url)}</td></tr>`).join('')}</table></div>`;S.risks=`<h1>${T('Legal & regulatory')}</h1><div class="card"><table><tr><th>${T('Matter')}</th><th>${T('Status')}</th><th>${T('Date')}</th><th>${T('Source')}</th></tr>${D.risk.map(x=>`<tr><td><b>${x.k}</b></td><td>${x.status}</td><td>${x.date||na()}</td><td class="src">${lk(x.src,x.url)}</td></tr>`).join('')}</table></div>`;
 S.muse=`<h1>${T('Muse & AI products')}</h1><div class="card"><h2>${T('What is Muse?')}</h2><p>Muse is the model family built by <b>Meta Superintelligence Labs (MSL)</b>, led by Chief AI Officer Alexandr Wang, replacing Llama as Meta's frontier line. The first model, Muse Spark (8 Apr 2026), is proprietary; Muse Spark Open (15 Oct 2026) is the first open-weight Muse. Models are served in Meta AI, the Meta Model API (dev.meta.ai) and Muse Code. ${lk('Meta AI blog','https://ai.meta.com/blog/introducing-muse-spark-msl/')}</p></div>
 <div class="card"><h2>${T('Muse timeline')}</h2><table><tr><th>${T('Date')}</th><th>${T('Model')}</th><th>${T('What it is')}</th><th>${T('Benchmarks')}</th><th>${T('Source')}</th></tr>${D.muse.map(m=>`<tr><td>${m.date}</td><td><b>${m.name}</b></td><td>${m.kind}</td><td>${m.bench.startsWith('n/a')?'<span class="na">'+m.bench+'</span>':m.bench}</td><td class="src">${lk(m.src,m.url)}${m.url2?'<br>'+lk(m.src2,m.url2):''}</td></tr>`).join('')}</table></div>`;
 S.people=`<h1>${T('Key people')}</h1><p class="sub">${T('Verified quotes only: official transcripts, press releases and verified X accounts. Each is dated and linked.')}</p>`+['Mark Zuckerberg','Susan Li','Alexandr Wang'].map(p=>{const qs=D.quotes.filter(q=>q.who===p);return `<div class="card"><h2>${p} <span class="src">· ${qs[0].role}</span></h2>${qs.map(q=>`<div class="q"><div class="t">“${q.q}”</div>${L()==='zh'?`<div class="z">译文：${q.zh}</div>`:''}<div class="m">${q.date} · ${lk(q.via,q.url)}</div></div>`).join('')}</div>`}).join('');
 const F=D.f13.funds,pers=[...new Set(F.flatMap(f=>f.points.map(p=>p.per)))].sort().slice(-8);
 const cell=(f,per)=>{const i=f.points.findIndex(p=>p.per===per),p=f.points[i];const note=(D.f13_notes[f.cik]||{})[per];if(!p)return `<td class="n"><span class="na" title="${note||''}">${note?'13F-NT':T('n/a')}</span></td>`;const pv=f.points[i-1];let ch='';if(pv){const d=p.shares-pv.shares;ch=pv.shares===0&&p.shares>0?`<div class="pos">${T('New')}</div>`:p.shares===0&&pv.shares>0?`<div class="neg">${T('Sold out')}</div>`:d?`<div class="${d>0?'pos':'neg'}">${d>0?'+':''}${fmtN(d)}</div>`:'<div class="src">0</div>'}
  return `<td class="n">${p.shares?`<a href="${p.url}" target="_blank">${fmtN(p.shares)}</a><div class="src">$${(p.value/1e6).toFixed(0)}m</div>`:`<span class="na">${T('Not held')}</span>`}${ch}${p.options.length?`<div class="src" style="white-space:normal">${T('Options')}: ${['Call','Put'].map(k=>{const t=p.options.filter(o=>o[0].toLowerCase()===k.toLowerCase()).reduce((a,o)=>a+o[1],0);return t?k+' '+(t/1e6).toFixed(2)+'m sh':''}).filter(Boolean).join(' · ')}</div>`:''}</td>`};
 S['13f']=`<style>main{max-width:1900px}</style><h1>${T('13F hedge funds')}</h1><p class="sub">SEC EDGAR Form 13F-HR information tables, CUSIP ${D.f13.cusip}. Share counts and reported value are <b>as of each quarter-end</b> (filed up to 45 days later). Q3 2026 13Fs are due 14 Nov 2026.</p>
 <div class="card"><h2>${T('META shares held by quarter (as of quarter-end)')}</h2><div class="cw" style="height:380px"><canvas id="c4"></canvas></div></div>
 <div class="card" style="overflow-x:auto;max-width:none"><table><tr><th>${T('Fund')}</th>${pers.map(p=>`<th class="n">${ql(p)}<div class="src">as of ${p}</div></th>`).join('')}</tr>${F.map(f=>`<tr><td style="min-width:150px"><b>${f.name}</b><div class="src">CIK ${f.cik}</div></td>${pers.map(p=>cell(f,p)).join('')}</tr>`).join('')}</table>
 <p class="src">Long share positions only (SH); put/call rows listed separately. Value = 13F reported value in US$. Pershing Square filed a 13F-NT for Q2 2026 (positions reported under another manager), so that quarter is n/a. Citadel Advisors and Renaissance are multi-strategy/quant and trade frequently. Click a share count for the filing.</p></div>`;
 S.muse+=S.strategy;
 document.getElementById('main').innerHTML=TABS.map(([k])=>`<section class="${k===tab?'on':''}" id="s-${k}">${k===tab?S[k]:''}</section>`).join('');
 document.getElementById('foot').textContent='© 2026 Hugo Tian · Sources linked inline · Not investment advice';
 const cap=id=>{const el=document.getElementById(id);if(!el)return;const r=D.capex.rows;charts.push(new Chart(el,{type:'bar',data:{labels:r.map(x=>ql(x[0])),datasets:[{label:T('Purchases of property & equipment'),data:r.map(x=>x[1]/1e9),backgroundColor:'#0081FB'},{label:T('Finance-lease principal payments'),data:r.map(x=>x[2]==null?null:x[2]/1e9),backgroundColor:'#7B2FD6'}]},options:{maintainAspectRatio:false,animation:false,scales:{x:{stacked:true},y:{stacked:true,title:{display:true,text:'US$bn'}}}}}))};
 cap('c0');cap('c1');finCharts();
 const g=document.getElementById('c2');if(g)charts.push(new Chart(g,{type:'bar',data:{labels:D.guide.map(x=>x.date),datasets:[{label:'FY2026 capex guide (US$bn)',data:D.guide.map(x=>[x.lo,x.hi]),backgroundColor:'#0081FB'}]},options:{indexAxis:'y',maintainAspectRatio:false,animation:false,scales:{x:{min:100,max:150}}}}));

 const h=document.getElementById('c4');if(h){const pal=['#0081FB','#ed1c24','#1d8a3a','#b25000','#7a2fd6','#00a3a3','#6e6e73','#d4a017','#ff6b9a','#8e8e93'];charts.push(new Chart(h,{type:'line',data:{labels:pers.map(p=>ql(p)+' ('+p+')'),datasets:F.map((f,i)=>({label:f.name,data:pers.map(p=>{const x=f.points.find(q=>q.per===p);return x?x.shares/1e6:null}),borderColor:pal[i],backgroundColor:pal[i],spanGaps:false,tension:.2}))},options:{maintainAspectRatio:false,animation:false,scales:{y:{title:{display:true,text:'shares (m), as of quarter-end'}}}}}))}

document.getElementById('lang').onclick=()=>{const n=L()==='zh'?'en':'zh';document.documentElement.dataset.lang=n;try{localStorage.setItem('meta-lang',n)}catch(e){}applyTheme();render()};

const Q={d:null,err:null,at:null,prev:null};
const QURL='https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=META&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1';
const sgt=ms=>new Date(ms).toLocaleString('en-GB',{timeZone:'Asia/Singapore',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const STAT={REG_MKT:['Regular session','常规交易时段'],PRE_MKT:['Pre-market','盘前'],POST_MKT:['After hours','盘后'],CLOSED:['Market closed','休市']};
function quoteHTML(){const z=L()==='zh';if(!Q.d)return `<span class="na">${Q.err?(z?'实时报价暂不可用，正在重试':'Live quote unavailable, retrying'):(z?'正在加载实时报价…':'Loading live quote…')}</span>`;
 const q=Q.d,c=parseFloat(q.change),cls=c>=0?'pos':'neg',st=STAT[q.curmktstatus]||[q.curmktstatus,q.curmktstatus],x=q.ExtendedMktQuote;
 return `<div class="lq"><span class="px">$${q.last}</span><span class="ch ${cls}">${q.change} (${q.change_pct})</span><span class="src">${z?st[1]:st[0]}${x?` · ${STAT[x.type]?(z?STAT[x.type][1]:STAT[x.type][0]):x.type} $${x.last} <span class="${parseFloat(x.change)>=0?'pos':'neg'}">${x.change} (${x.change_pct})</span>`:''}</span></div>
 <p class="src">${z?'更新于':'Updated'} ${sgt(Q.at)} SGT · ${z?'最后成交日':'last trade date'} ${q.last_timedate} · ${z?'来源':'Source'}: CNBC quote feed (${q.source}; ${q.realTime==='true'?(z?'实时':'real-time'):(z?'可能延迟':'may be delayed')}) · ${z?'每15秒刷新':'refreshes every 15 s'}${Q.err?(z?' · 最近一次有效数据，重试中':' · last good update, retrying'):''}</p>`}
async function pollQuote(){try{const r=await fetch(QURL,{cache:'no-store'});const j=await r.json();const q=j.FormattedQuoteResult.FormattedQuote[0];if(!q||!q.last)throw new Error('empty');Q.d=q;Q.err=null;Q.at=Date.now()}catch(e){Q.err=String(e)}const el=document.getElementById('lq');if(el)el.innerHTML=quoteHTML()}
setInterval(()=>{if(!document.hidden)pollQuote()},15000);
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function applyTheme(){const t=document.documentElement.dataset.theme||'auto',z=L()==='zh';document.getElementById('themelbl').textContent=t==='auto'?(z?'自动':'Auto'):t==='dark'?(z?'深色':'Dark'):(z?'浅色':'Light');document.getElementById('themeic').textContent=t==='auto'?'◐':t==='dark'?'☾':'☀';
 Chart.defaults.color=isDark()?'#a1a1a6':'#6e6e73';Chart.defaults.borderColor=isDark()?'rgba(255,255,255,.1)':'rgba(0,0,0,.08)'}
document.getElementById('themebtn').onclick=()=>{const h=document.documentElement,cur=h.dataset.theme||'auto',nx=cur==='auto'?(isDark()?'light':'dark'):cur==='dark'?'light':'auto';
 if(nx==='auto'){delete h.dataset.theme;try{localStorage.removeItem('meta-theme')}catch(e){}}else{h.dataset.theme=nx;try{localStorage.setItem('meta-theme',nx)}catch(e){}}applyTheme();render()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render()});
window.addEventListener('hashchange',render);applyTheme();render();pollQuote();
</script></body></html>
